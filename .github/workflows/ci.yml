name: React CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: react-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build Vercel application
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: public-ci-placeholder
        run: npm run build
